name: CAL-07 spatial roughness tail holdout

on:
  push:
    branches: [fix/native-hd-v4]
    paths:
      - 'simscan/config.py'
      - 'simscan/realism.py'
      - 'tools/calibrate_multiroom_surfaces.py'
      - 'tools/validate_cal07_spatial_tail.py'
      - 'tests/test_cal07_spatial_tail.py'
      - 'tools/CAL07_SPATIAL_TAIL.md'
      - '.github/workflows/cal07-spatial-tail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spatial-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Open3D and numerical dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0 libegl1 libopengl0
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11' 'PyYAML>=6,<7' 'shapely>=2' 'opencv-python-headless>=4.8' 'pye57>=0.4' 'open3d>=0.18,<0.21' 'pillow>=10,<13' 'pytest>=8,<10'
      - name: Run CAL-07 and prior calibration regressions
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m pytest -q tests/test_cal07_spatial_tail.py tests/test_realism.py tests/test_cal06_holdout.py tests/test_cal05_paired_factorials.py tests/test_cal04_multiroom_surfaces.py
      - name: Run eight paired unseen scenes across three spatial-tail variants
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPEN3D_CPU_RENDERING: 'true'
        run: |
          python tools/validate_cal07_spatial_tail.py --out /tmp/cal07 \
            --seeds 44101 44102 44103 44104 44105 44106 44107 44108 --max-sample 250000
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/cal07/cal07_results.json')
          r = json.loads(p.read_text(encoding='utf8'))
          assert len(r['design']['holdout_seeds']) == 8
          assert all(len(v['paired_scenes']) == 8 for v in r['variants'].values())
          assert r['auto_update_production_config'] is False
          assert r['design']['disjoint_from_cal03_cal06'] is True
          print('CAL07 decision:', r['candidate_decision'])
          print('Tail gates:', {k: v['gates'] for k, v in r['variants'].items()})
          PY
      - name: Upload derived reports only, no XYZ or point clouds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal07-spatial-tail-results
          path: |
            /tmp/cal07/cal07_results.json
            /tmp/cal07/CAL07_REPORT.md
            /tmp/cal07/cal07_partial_progress.json
          if-no-files-found: warn
          retention-days: 14
