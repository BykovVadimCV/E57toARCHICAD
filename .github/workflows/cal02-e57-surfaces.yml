name: CAL-02 E57 wall-surface estimator

on:
  push:
    branches: [fix/native-hd-v4]
    paths:
      - 'tools/calibrate_e57_surfaces.py'
      - 'tools/CAL02_SURFACES.md'
      - 'tests/test_e57_surface_calibration.py'
      - 'notebooks/colab_cal02_real_e57_surfaces.ipynb'
      - '.github/workflows/cal02-e57-surfaces.yml'
  workflow_dispatch:

jobs:
  local-plane-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded numerical runtime
        run: python -m pip install 'numpy>=1.26,<3' 'pytest>=8,<10'
      - name: Test streaming reservoir, vertical planes, and uncertainty rules
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_e57_surface_calibration.py
      - name: Smoke-test CLI on controlled synthetic measurement fixture
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python - <<'PY'
          import numpy as np
          from pathlib import Path
          rng=np.random.default_rng(123)
          wall=np.c_[rng.normal(0,0.002,14000),rng.uniform(0,5,14000),rng.uniform(.25,2.75,14000)]
          floor=np.c_[rng.uniform(-1,3,3000),rng.uniform(0,5,3000),rng.normal(0,.002,3000)]
          p=Path('/tmp/cal02_fixture.npz')
          np.savez_compressed(p,xyz=np.r_[wall,floor])
          print('fixture:',p)
          PY
          python tools/calibrate_e57_surfaces.py --sample-npz /tmp/cal02_fixture.npz --out /tmp/CAL02_smoke --seed 42
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/CAL02_smoke/cal02_surface_calibration.json').read_text())
          p=r['files'][0]['surfaces']['summary']
          assert p['n_patches'] >= 1, 'Expected measured wall patches'
          assert 0 < p['median_observed_plane_mad_mm'] < 8, p
          assert 'NO_AUTOMATIC_SCANNER_PARAMETER_CHANGE' not in str(p)
          print('CAL-02 fixture estimates local observed plane thickness, not device sigma')
          PY
      - name: Upload only synthetic diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: cal02-synthetic-plane-fixture
          path: /tmp/CAL02_smoke/
          retention-days: 14
