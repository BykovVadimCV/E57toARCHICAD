name: CAL-09.1 mesh ground-truth validation

on:
  push:
    branches: [experiment/cal09-1-ground-truth-validation]
    paths:
      - 'tools/cal091_mesh_truth.py'
      - 'tools/validate_cal091_ground_truth.py'
      - 'tests/test_cal091_mesh_truth.py'
      - 'tests/test_cal091_protocol.py'
      - '.github/workflows/cal091-mesh-truth.yml'
  pull_request:
    paths:
      - 'tools/cal091_mesh_truth.py'
      - 'tools/validate_cal091_ground_truth.py'
      - 'tests/test_cal091_mesh_truth.py'
      - '.github/workflows/cal091-mesh-truth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mesh-truth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the minimal existing generator and calibration dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0 libegl1 libopengl0
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11' 'PyYAML>=6,<7' 'shapely>=2' 'opencv-python-headless>=4.8' 'pye57>=0.4' 'open3d>=0.18,<0.21' 'pytest>=8,<10'
      - name: Regression tests CAL-07 through CAL-09.1
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m pytest -q tests/test_cal07_spatial_tail.py tests/test_cal08_tail_zones.py tests/test_cal09_two_scale_defects.py tests/test_cal091_mesh_truth.py tests/test_cal091_protocol.py
      - name: Smoke test one seed and one mesh resolution
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPEN3D_CPU_RENDERING: 'true'
        run: |
          python tools/validate_cal091_ground_truth.py --out /tmp/cal091_smoke --seeds 46101 --resolutions 0.30 --save-truth none
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/cal091_smoke/cal091_results.json').read_text())
          assert r['format']=='cal091-ground-truth-spatial-validation-v1'
          assert len(r['scene_metrics'])==5
          assert r['auto_update_production_config'] is False
          assert r['checks']['all_paired_geometry_hashes_match']
          assert r['checks']['fine_does_not_move_coarse_mask']
          assert r['checks']['coarse_does_not_move_fine_texture']
          print('CAL-09.1 single-seed smoke completed; statistical gate FAIL expected for incomplete design')
          PY
      - name: Upload aggregated smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal091-mesh-truth-smoke
          path: |
            /tmp/cal091_smoke/cal091_results.json
            /tmp/cal091_smoke/CAL091_REPORT.md
            /tmp/cal091_smoke/cal091_progress.json
          if-no-files-found: warn
          retention-days: 14
