name: HD masks and clutter tests

on:
  push:
    branches:
      - feature/native-hd-masks-and-clutter
  pull_request:
    paths:
      - 'simscan/**'
      - 'tests/test_hdmask.py'
      - 'tests/test_clutter_models.py'
      - '.github/workflows/test-hd-clutter.yml'
  workflow_dispatch:

jobs:
  geometry-and-clutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install minimal unit-test dependencies
        run: python -m pip install -U pip pytest numpy scipy opencv-python-headless pyyaml pillow shapely
      - name: Run native HD mask and clutter tests
        run: python -m pytest -q tests/test_hdmask.py tests/test_clutter_models.py tests/test_scan_visual_style.py tests/test_full_scan_and_doors.py
      - name: Install Open3D system graphics libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgomp1 libxrender1 libxext6
      - name: Install 3D raycasting dependency
        run: python -m pip install 'open3d>=0.18' 'pye57>=0.4.10'
      - name: Verify closed door raycasting with Open3D
        run: python -m pytest -q tests/test_full_scan_and_doors.py
      - name: Simulate one complete 2 mm training scene
        run: |
          python -m simscan make-dataset \
            --config configs/customer_like.yaml \
            --set layout.source=simscan \
            --set layout.p_duplex=0 \
            --set scanner.angular_step_deg=0.5 \
            --set interior.p_bare=0.0 \
            --set interior.clutter_per_m2=0.3 \
            --set interior.p_detailed_clutter=1.0 \
            --seed 42 --count 1 --workers 1 --variants 1 --keep-scans \
            --hd-masks --hd-pixel-mm 2 --out /tmp/simscan_hd_smoke
          python - <<'PY'
          import json
          from pathlib import Path
          import cv2
          p = Path('/tmp/simscan_hd_smoke')
          levels = list(p.glob('scenes/*/L*/wall_mask_hd.png'))
          assert levels, 'No HD wall masks produced'
          for mask_path in levels:
              d = mask_path.parent
              info = json.loads((d / 'wall_mask_hd.json').read_text())
              frame = info['frame']
              wall = cv2.imread(str(mask_path), cv2.IMREAD_UNCHANGED)
              edges = cv2.imread(str(d / 'wall_edges_hd.png'), cv2.IMREAD_UNCHANGED)
              openings = cv2.imread(str(d / 'openings_hd.png'), cv2.IMREAD_UNCHANGED)
              assert wall is not None and edges is not None and openings is not None
              assert wall.shape == edges.shape == openings.shape == (frame['height'], frame['width'])
              assert frame['pixel_m'] == 0.002
              assert wall.shape[0] >= 1152 and wall.shape[1] >= 2048
              assert (wall != 0).any(), 'Empty wall geometry'
              assert ((wall == 0) | (wall == 255)).all(), 'Wall mask not binary'
              assert ((openings == 0) | (wall == 0)).all(), 'Walls and openings overlap'
              print('VERIFIED', d, wall.shape, frame['pixel_m'])
          layout = json.loads((p / '_work/scene_00000/layout.json').read_text())
          coverage = layout['meta']['coverage']
          assert coverage['required'] is True
          assert coverage['total_rooms'] == coverage['verified_rooms'] == len(layout['rooms'])
          assert all(room['station_count'] > 0 and room['architectural_returns'] >= 30
                     for room in coverage['rooms'])
          interior_doors = [o for o in layout['openings']
                            if o['kind'] == 'door' and len(o['rooms']) >= 2]
          assert sum(o['angle_deg'] == 0.0 for o in interior_doors) >= min(1, len(interior_doors))
          print('FULL ROOM COVERAGE', coverage['verified_rooms'], 'of', coverage['total_rooms'])
          print('CLOSED INTERIOR DOORS', sum(o['angle_deg'] == 0.0 for o in interior_doors))
          print('End-to-end smoke test PASS: ', len(levels), 'level(s)')
          PY
      - name: Project the actual simulated E57 point cloud at 2 mm
        run: |
          PYTHONPATH=. python tools/preview_scan_hd.py \
            --scene-dir /tmp/simscan_hd_smoke/_work/scene_00000 \
            --level-dir /tmp/simscan_hd_smoke/scenes/scene_00000/L1 \
            --preview-width 1800
      - name: Prepare one mask preview from actual 2 mm output
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import cv2
          results = list(Path('/tmp/simscan_hd_smoke').glob('scenes/*/L*/wall_mask_hd.png'))
          if not results:
              print('No mask generated; nothing to preview')
          else:
              source = results[0]
              mask = cv2.imread(str(source), cv2.IMREAD_GRAYSCALE)
              h, w = mask.shape
              scale = min(1, 1600 / max(w, h))
              scaled = cv2.resize(mask, (round(w * scale), round(h * scale)),
                                  interpolation=cv2.INTER_AREA)
              out = Path('/tmp/hd_wall_preview.png')
              cv2.imwrite(str(out), scaled)
              print('Original', source, w, h, 'Preview', scaled.shape)
          PY
      - name: Upload generated mask and preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-2mm-scan-and-mask-seed42
          path: |
            /tmp/hd_wall_preview.png
            /tmp/simscan_hd_smoke/scenes/*/L*/scan_topdown_2mm.png
            /tmp/simscan_hd_smoke/scenes/*/L*/scan_topdown_preview.png
            /tmp/simscan_hd_smoke/scenes/*/L*/scan_topdown_meta.json
            /tmp/simscan_hd_smoke/scenes/*/L*/scan_extractor_4k.png
            /tmp/simscan_hd_smoke/scenes/*/L*/scan_extractor_4k.json
            /tmp/simscan_hd_smoke/scenes/*/L*/wall_mask_hd.png
            /tmp/simscan_hd_smoke/scenes/*/L*/openings_hd.png
          if-no-files-found: warn
          retention-days: 7
