name: CAL-09.3 multiscale observability independent holdout

on:
  push:
    branches: [experiment/cal09-3-multiscale-observability]
    paths:
      - 'tools/cal093_multiscale_features.py'
      - 'tools/cal093_threshold_selection.py'
      - 'tools/validate_cal093_multiscale.py'
      - 'tools/aggregate_cal093.py'
      - 'tests/test_cal093_multiscale.py'
      - '.github/workflows/cal093-multiscale-holdout.yml'
  pull_request:
    paths:
      - 'tools/cal093_multiscale_features.py'
      - 'tools/cal093_threshold_selection.py'
      - 'tools/validate_cal093_multiscale.py'
      - 'tools/aggregate_cal093.py'
      - 'tests/test_cal093_multiscale.py'
      - '.github/workflows/cal093-multiscale-holdout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cal093-fixtures-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scanner and evaluation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0 libegl1 libopengl0
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11' 'PyYAML>=6,<7' 'shapely>=2' 'opencv-python-headless>=4.8' 'pye57>=0.4' 'open3d>=0.18,<0.21' 'pytest>=8,<10'
      - name: Regression and GT-oracle threshold/shape unit tests
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m pytest -q tests/test_cal07_spatial_tail.py tests/test_cal08_tail_zones.py \
            tests/test_cal09_two_scale_defects.py tests/test_cal091_mesh_truth.py \
            tests/test_cal091_protocol.py tests/test_cal092_observability.py \
            tests/test_cal093_multiscale.py
      - name: Two-scene 0.5 degree feature extraction smoke
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPEN3D_CPU_RENDERING: 'true'
        run: |
          python -u tools/validate_cal093_multiscale.py --out /tmp/cal093_smoke \
            --seeds 46101 --variants uniform_2_4 zone18_fine35 \
            --resolutions 0.30 --angular-step-deg 0.50 --max-sample 20000
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/cal093_smoke/cal093_scores.json').read_text())
          assert len(d['cases'])==2
          assert d['auto_update_production_config'] is False
          assert len({c['layout_station_signature'] for c in d['cases']})==1
          for c in d['cases']:
              assert c['patch_scores']['n_eligible_cells']>0
              assert c['patch_scores']['same_rays_each_ablation']
              assert all(set(x['scores_mm'])==set(('ideal','range_only','registration_only','combined'))
                         for x in c['patch_scores']['cells'])
          print('CAL-09.3 smoke success:', [(c['variant'],c['patch_scores']['n_eligible_cells']) for c in d['cases']])
          PY
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal093-smoke
          path: |
            /tmp/cal093_smoke/cal093_scores.json
            /tmp/cal093_smoke/cal093_progress.json
          retention-days: 14
          if-no-files-found: warn

  cal093-one-seed:
    needs: cal093-fixtures-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [46101, 46102, 46105, 46106, 47101, 47102, 47105, 47106]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scanner and evaluation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0 libegl1 libopengl0
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11' 'PyYAML>=6,<7' 'shapely>=2' 'opencv-python-headless>=4.8' 'pye57>=0.4' 'open3d>=0.18,<0.21' 'pytest>=8,<10'
      - name: Six paired scanner scenes at 0.1 degree per seed
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPEN3D_CPU_RENDERING: 'true'
        run: |
          python -u tools/validate_cal093_multiscale.py \
            --out /tmp/cal093_seed_${{ matrix.seed }} \
            --seeds ${{ matrix.seed }} \
            --max-sample 180000 --angular-step-deg 0.1
      - name: Upload per-seed score data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal093-seed-${{ matrix.seed }}
          path: |
            /tmp/cal093_seed_${{ matrix.seed }}/cal093_scores.json
            /tmp/cal093_seed_${{ matrix.seed }}/cal093_progress.json
          retention-days: 30
          if-no-files-found: warn

  cal093-independent-holdout:
    needs: cal093-one-seed
    if: ${{ needs.cal093-one-seed.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analytical dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11' 'PyYAML>=6,<7' 'shapely>=2'
      - uses: actions/download-artifact@v4
        with:
          pattern: cal093-seed-*
          path: /tmp/cal093_shards
      - name: Choose threshold on old development seeds, evaluate independent holdout
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python tools/aggregate_cal093.py --out /tmp/cal093_final \
            /tmp/cal093_shards/cal093-seed-*/cal093_scores.json
      - name: Publish canonical independent-seed report
        uses: actions/upload-artifact@v4
        with:
          name: cal093-independent-holdout-final
          path: |
            /tmp/cal093_final/cal093_holdout_results.json
            /tmp/cal093_final/CAL093_REPORT.md
          if-no-files-found: error
          retention-days: 30
