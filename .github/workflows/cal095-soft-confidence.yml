name: CAL-09.5 probabilistic spatial confidence fresh holdout

on:
  push:
    branches: [experiment/cal09-5-soft-spatial-confidence]
    paths:
      - 'tools/cal095_soft_confidence.py'
      - 'tools/validate_cal095_confidence.py'
      - 'tools/aggregate_cal095.py'
      - 'tests/test_cal095_soft_confidence.py'
      - '.github/workflows/cal095-soft-confidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cal095-regression-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometry and scanner dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0 libegl1 libopengl0
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11' 'PyYAML>=6,<7' 'shapely>=2' 'opencv-python-headless>=4.8' 'pye57>=0.4' 'open3d>=0.18,<0.21' 'pytest>=8,<10'
      - name: CAL-07 through CAL-09.5 targeted regressions
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m pytest -q \
            tests/test_cal07_spatial_tail.py \
            tests/test_cal08_tail_zones.py \
            tests/test_cal09_two_scale_defects.py \
            tests/test_cal091_mesh_truth.py \
            tests/test_cal091_protocol.py \
            tests/test_cal092_observability.py \
            tests/test_cal093_multiscale.py \
            tests/test_cal094_spatial.py \
            tests/test_cal095_soft_confidence.py
      - name: Two-variant real raycaster smoke at noncanonical 0.5-degree spacing
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPEN3D_CPU_RENDERING: 'true'
        run: |
          python -u tools/validate_cal095_confidence.py \
            --out /tmp/cal095_smoke --seeds 50101 \
            --variants uniform_2_4 zone18_fine35 \
            --angular-step-deg 0.50 --max-sample 20000
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/cal095_smoke/cal095_scores.json').read_text())
          assert x['n_scans']==2
          assert x['auto_update_production_config'] is False
          assert all(c['patch_scores']['n_eligible_cells']>0 for c in x['cases'])
          assert len({c['layout_station_signature'] for c in x['cases']}) == 1
          print('CAL-09.5 actual scanner smoke: PASS')
          PY
      - name: Save diagnostic smoke scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal095-smoke
          path: |
            /tmp/cal095_smoke/cal095_scores.json
            /tmp/cal095_smoke/cal095_progress.json
          retention-days: 14
          if-no-files-found: warn

  cal095-one-seed:
    needs: cal095-regression-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [50101, 50102, 50105, 50106, 51101, 51102, 51105, 51106]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scanner dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0 libegl1 libopengl0
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11' 'PyYAML>=6,<7' 'shapely>=2' 'opencv-python-headless>=4.8' 'pye57>=0.4' 'open3d>=0.18,<0.21' 'pytest>=8,<10'
      - name: Three canonical real-raycast variants on mesh 0.10m
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPEN3D_CPU_RENDERING: 'true'
        run: |
          python -u tools/validate_cal095_confidence.py \
            --out /tmp/cal095_seed_${{ matrix.seed }} \
            --seeds ${{ matrix.seed }} \
            --angular-step-deg 0.10 --max-sample 180000
      - name: Upload one-seed experimental scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal095-seed-${{ matrix.seed }}
          path: |
            /tmp/cal095_seed_${{ matrix.seed }}/cal095_scores.json
            /tmp/cal095_seed_${{ matrix.seed }}/cal095_progress.json
          retention-days: 30
          if-no-files-found: warn

  cal095-independent-holdout:
    needs: cal095-one-seed
    if: ${{ needs.cal095-one-seed.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight analysis dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11' 'PyYAML>=6,<7' 'shapely>=2'
      - uses: actions/download-artifact@v4
        with:
          pattern: cal095-seed-*
          path: /tmp/cal095_shards
      - name: Grouped development CV then independent 511xx holdout
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -u tools/aggregate_cal095.py --out /tmp/cal095_final \
            /tmp/cal095_shards/cal095-seed-*/cal095_scores.json
      - name: Publish final report
        uses: actions/upload-artifact@v4
        with:
          name: cal095-independent-holdout-final
          path: |
            /tmp/cal095_final/cal095_holdout_results.json
            /tmp/cal095_final/CAL095_REPORT.md
          retention-days: 30
          if-no-files-found: error
