name: CAL-09.4 fresh-seed spatial coherence holdout

on:
  push:
    branches: [experiment/cal09-4-spatial-coherence-holdout]
    paths:
      - 'tools/cal094_spatial_selection.py'
      - 'tools/validate_cal094_spatial.py'
      - 'tools/aggregate_cal094.py'
      - 'tests/test_cal094_spatial.py'
      - '.github/workflows/cal094-spatial-coherence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cal094-regression-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scanner and feature-analysis dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0 libegl1 libopengl0
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11' 'PyYAML>=6,<7' 'shapely>=2' 'opencv-python-headless>=4.8' 'pye57>=0.4' 'open3d>=0.18,<0.21' 'pytest>=8,<10'
      - name: CAL-07 through CAL-09.4 targeted regression
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m pytest -q \
            tests/test_cal07_spatial_tail.py \
            tests/test_cal08_tail_zones.py \
            tests/test_cal09_two_scale_defects.py \
            tests/test_cal091_mesh_truth.py \
            tests/test_cal091_protocol.py \
            tests/test_cal092_observability.py \
            tests/test_cal093_multiscale.py \
            tests/test_cal094_spatial.py
      - name: Actual scanner two-case fresh-seed smoke
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPEN3D_CPU_RENDERING: 'true'
        run: |
          python -u tools/validate_cal094_spatial.py \
            --out /tmp/cal094_smoke \
            --seeds 48101 --variants uniform_2_4 zone18_fine35 \
            --resolutions 0.30 --angular-step-deg 0.50 --max-sample 20000
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/cal094_smoke/cal094_scores.json').read_text())
          assert d['format']=='cal094-observed-feature-seed-shard-v1'
          assert d['n_cases']==2
          assert {x['variant'] for x in d['cases']}=={'uniform_2_4','zone18_fine35'}
          assert len({x['layout_station_signature'] for x in d['cases']})==1
          assert all(x['patch_scores']['n_eligible_cells']>0 for x in d['cases'])
          assert d['auto_update_production_config'] is False
          print('CAL-09.4 fresh-seed smoke: PASS')
          PY
      - name: Save smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal094-smoke
          path: |
            /tmp/cal094_smoke/cal094_scores.json
            /tmp/cal094_smoke/cal094_progress.json
          if-no-files-found: warn
          retention-days: 14

  cal094-one-seed:
    needs: cal094-regression-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        seed: [48101, 48102, 48105, 48106, 49101, 49102, 49105, 49106]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scanner and feature-analysis dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0 libegl1 libopengl0
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11' 'PyYAML>=6,<7' 'shapely>=2' 'opencv-python-headless>=4.8' 'pye57>=0.4' 'open3d>=0.18,<0.21' 'pytest>=8,<10'
      - name: Six canonical 0.1-degree full raycasting simulations
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPEN3D_CPU_RENDERING: 'true'
        run: |
          python -u tools/validate_cal094_spatial.py \
            --out /tmp/cal094_seed_${{ matrix.seed }} \
            --seeds ${{ matrix.seed }} \
            --max-sample 180000 \
            --angular-step-deg 0.10
      - name: Publish independent seed shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal094-seed-${{ matrix.seed }}
          path: |
            /tmp/cal094_seed_${{ matrix.seed }}/cal094_scores.json
            /tmp/cal094_seed_${{ matrix.seed }}/cal094_progress.json
          if-no-files-found: warn
          retention-days: 30

  cal094-independent-holdout:
    needs: cal094-one-seed
    if: ${{ needs.cal094-one-seed.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install aggregation dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11' 'PyYAML>=6,<7' 'shapely>=2'
      - uses: actions/download-artifact@v4
        with:
          pattern: cal094-seed-*
          path: /tmp/cal094_shards
      - name: Freeze rule on 481xx then evaluate only 491xx holdout
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python tools/aggregate_cal094.py --out /tmp/cal094_final \
            /tmp/cal094_shards/cal094-seed-*/cal094_scores.json
      - name: Upload report and full reproducible metrics
        uses: actions/upload-artifact@v4
        with:
          name: cal094-independent-holdout-final
          path: |
            /tmp/cal094_final/cal094_holdout_results.json
            /tmp/cal094_final/CAL094_REPORT.md
          if-no-files-found: error
          retention-days: 30
