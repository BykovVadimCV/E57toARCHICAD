name: CAL-03 real vs synthetic surface residuals

on:
  push:
    branches: [fix/native-hd-v4]
    paths:
      - '.github/workflows/cal03-real-vs-synthetic.yml'
      - 'tools/calibrate_real_synthetic_surfaces.py'
      - 'tools/calibrate_e57_surfaces.py'
      - 'tools/CAL03_SURFACES.md'
      - 'tests/test_cal03_surface_comparison.py'
      - 'configs/calibration_real_e57_surfaces.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitivity-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install 3D raycasting and numeric dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0 libegl1 libopengl0
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11' 'PyYAML>=6,<7' 'shapely>=2' 'opencv-python-headless>=4.8' 'pye57>=0.4' 'open3d>=0.18,<0.21' 'pytest>=8,<10'
      - name: Unit test calibration estimator and parameter lock
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m pytest -q tests/test_e57_surface_calibration.py tests/test_cal03_surface_comparison.py
      - name: Compare two seeds by five controlled variants
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPEN3D_CPU_RENDERING: 'true'
        run: |
          python tools/calibrate_real_synthetic_surfaces.py \
            --out /tmp/cal03 \
            --real-reference configs/calibration_real_e57_surfaces.json \
            --config configs/customer_like.yaml \
            --seeds 42111 42112 --max-sample 250000 --max-patches 24
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/cal03/cal03_comparison.json')
          x=json.loads(p.read_text())
          assert x['auto_update_production_config'] is False
          assert len(x['comparisons']) == 5
          assert len(x['all_scenes']) == 10
          assert all(v['attempted_scenes']==2 for v in x['comparisons'].values())
          assert not any('range_sigma_mm' in v for v in x['comparisons'].values())
          print('CAL-03 completed, no automatic scanner tuning')
          PY
      - name: Upload aggregate statistics only, never scans or coordinates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal03-real-vs-synthetic-surface-residuals
          path: |
            /tmp/cal03/cal03_comparison.json
            /tmp/cal03/CAL03_REPORT.md
          if-no-files-found: warn
          retention-days: 14
