name: E57 native-HD density calibration

on:
  push:
    branches: [fix/native-hd-v4]
    paths:
      - 'tools/calibrate_hd_density.py'
      - 'tools/run_hd_density_sweep.py'
      - 'tests/test_hd_density_calibration.py'
      - '.github/workflows/calibrate-hd-density.yml'
      - 'configs/calibration_real_e57_observed.json'
  workflow_dispatch:

jobs:
  native-density-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONPATH: '.:tools'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENCV_IO_MAX_IMAGE_PIXELS: '64000000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU raycaster and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgomp1 libxrender1 libxext6
          python -m pip install -U pip numpy scipy opencv-python-headless pyyaml pillow shapely psutil 'open3d>=0.18' 'pye57>=0.4.10' pytest
      - name: Test metrical HD count comparisons
        run: python -m pytest -q tests/test_hd_density_calibration.py
      - name: Scan the same scene at 0.15, 0.1, 0.0667 degrees
        run: |
          python tools/run_hd_density_sweep.py \
            --out /tmp/e57_density_sweep --angles 0.15 0.1 0.0667 --seed 42111
      - name: Publish metrics and source evidence from small synthetic scenes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e57-native-hd-density-calibration
          path: |
            /tmp/e57_density_sweep/density_calibration.json
            /tmp/e57_density_sweep/density_calibration.md
            /tmp/e57_density_sweep/angle_*/scenes/*/L*/scan_evidence_hd.json
            /tmp/e57_density_sweep/angle_*/scenes/*/L*/scan_counts_hd.npz
            /tmp/e57_density_sweep/angle_*/scenes/*/L*/scene.json
          if-no-files-found: warn
          retention-days: 14
