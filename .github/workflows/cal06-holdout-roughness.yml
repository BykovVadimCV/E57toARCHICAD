name: CAL-06 independent unseen-scene roughness holdout

on:
  push:
    branches: [fix/native-hd-v4]
    paths:
      - 'tools/validate_cal06_holdout.py'
      - 'tests/test_cal06_holdout.py'
      - 'tools/CAL06_HOLDOUT.md'
      - '.github/workflows/cal06-holdout-roughness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Open3D raycaster and numerical dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0 libegl1 libopengl0
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11' 'PyYAML>=6,<7' 'shapely>=2' 'opencv-python-headless>=4.8' 'pye57>=0.4' 'open3d>=0.18,<0.21' 'pytest>=8,<10'
      - name: Verify CAL-02–CAL-06 regressions and frozen holdout gates
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pytest -q tests/test_cal06_holdout.py tests/test_cal05_paired_factorials.py tests/test_cal04_multiroom_surfaces.py tests/test_e57_surface_calibration.py
      - name: Run eight new paired multroom scenes at 0.1 degrees
        env:
          PYTHONPATH: .:tools
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPEN3D_CPU_RENDERING: 'true'
        run: |
          python tools/validate_cal06_holdout.py --out /tmp/cal06 \
            --seeds 43101 43102 43103 43104 43105 43106 43107 43108 --max-sample 250000
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/cal06/cal06_results.json')
          r=json.loads(p.read_text(encoding='utf8'))
          assert len(r['paired_scenes'])==8
          assert len(r['design']['holdout_seeds'])==8
          assert all(x['relative_patch_retention']>0 for x in r['paired_scenes'])
          assert r['auto_update_production_config'] is False
          assert set(r['design']['holdout_seeds']).isdisjoint(r['design']['cal05_tuning_seeds'])
          print('CAL06 complete. Candidate decision:',r['candidate_decision'])
          print('Actual quality gates:',r['holdout']['gates'])
          PY
      - name: Upload derived reports only, never raw scan XYZ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal06-independent-holdout-results
          path: |
            /tmp/cal06/cal06_results.json
            /tmp/cal06/CAL06_REPORT.md
            /tmp/cal06/cal06_partial_progress.json
          if-no-files-found: warn
          retention-days: 14
