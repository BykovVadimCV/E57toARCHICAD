name: HD observation pilot (10 scenes)

on:
  push:
    branches: [fix/native-hd-v4]
    paths:
      - '.github/workflows/pilot-hd-10.yml'
  workflow_dispatch:

jobs:
  pilot-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENCV_IO_MAX_IMAGE_PIXELS: '64000000'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python raycasting and audit runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgomp1 libxrender1 libxext6
          python -m pip install -U pip pytest numpy scipy opencv-python-headless pyyaml pillow shapely psutil 'open3d>=0.18' 'pye57>=0.4.10'
      - name: Check audit invariants before generation
        run: python -m pytest -q tests/test_hd_observation_pilot.py tests/test_ray_evidence.py tests/test_observation.py tests/test_semantic_contract.py
      - name: Generate 8 ordinary + 2 passage-enriched diagnostic scenes at 2 mm
        run: |
          python tools/run_hd_pilot.py --out /tmp/e57_pilot10 --seed 31111 --mode diagnostic --workers 1
      - name: Record final output footprint
        if: always()
        run: |
          du -sh /tmp/e57_pilot10 2>/dev/null || true
          find /tmp/e57_pilot10/reports -maxdepth 1 -type f -print 2>/dev/null || true
      - name: Publish audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-hd-pilot-10-audit
          path: |
            /tmp/e57_pilot10/reports/
            /tmp/e57_pilot10/pilot_setup.json
            /tmp/e57_pilot10/baseline/build_contract.json
            /tmp/e57_pilot10/passage_enriched/build_contract.json
            /tmp/e57_pilot10/baseline/hd_audit.json
            /tmp/e57_pilot10/passage_enriched/hd_audit.json
            /tmp/e57_pilot10/baseline/make_log.jsonl
            /tmp/e57_pilot10/passage_enriched/make_log.jsonl
          if-no-files-found: warn
          retention-days: 14
      - name: Publish diagnostic pilot data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-hd-pilot-10-dataset
          path: |
            /tmp/e57_pilot10/baseline/scenes/
            /tmp/e57_pilot10/baseline/splits/
            /tmp/e57_pilot10/baseline/completed/
            /tmp/e57_pilot10/baseline/build_contract.json
            /tmp/e57_pilot10/baseline/meta.json
            /tmp/e57_pilot10/passage_enriched/scenes/
            /tmp/e57_pilot10/passage_enriched/splits/
            /tmp/e57_pilot10/passage_enriched/completed/
            /tmp/e57_pilot10/passage_enriched/build_contract.json
            /tmp/e57_pilot10/passage_enriched/meta.json
          compression-level: 6
          retention-days: 7
