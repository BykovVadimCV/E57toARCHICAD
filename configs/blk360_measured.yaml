# Сканер по реальному E57: открытый пример (офис, 21 станция, 7,2 ГБ, 319 млн точек; модель
# сканера в файле не указана, по сетке и шагу - BLK360). Числа - из отчёта `simscan inspect-e57`,
# сравнение с синтетикой - тем же отчётом (`simscan compare-e57`), то есть одной меркой.
#
# Измерено:
#   шаг 0,0667° по обеим осям (11,6 мм на 10 м); сетка 2700 строк (180°) x ~5600 столбцов,
#   все ячейки записаны (лучи без отклика - cartesianInvalidState); 15 млн лучей на станцию;
#   формат: xyz scaled integer 0,01 мм (32 бита), интенсивность float32 0..1, RGB, 22,5 Б/точку;
#   высота станции над полом 1,115-1,145 м; остаточный наклон 0,01-0,13°;
#   ближайшая точка 0,40-1,1 м; медиана дальности 2-3,7 м.
# Шум дальности (отклонение от плоскости соседей по сетке; значения первого отчёта
# умножены на 1,69 - поправка ошибки оценки, исправленной после него):
#   по нормали 0,4-0,6 мм на 0-10 м; на 65-75° - 1,7 мм (1 м) ... 5 мм (8 м); на 75-85° - до 9 мм.
#   Модель sigma = (s0 + k r) sec^p (+) пятно (exit + div r) tan / sqrt(12) ложится с
#   s0 0,40 мм, k 0,008 мм/м, p 0,6, div 0,56 мрад, exit 1,1 мм (по второму отчёту p поднят до 1,0).
# Смешанные пиксели (второй отчёт, исправленная мерка): на перепадах больше 15 см между ровными
#   поверхностями у 31 % пикселей точка лежит между ними, положение - почти равномерно 0..1.
#   В синтетике (без штор) это даёт порог разделения эха 1,4 м: 1,0 м - 24 %, 2,0 м - 38 %.
# Шум на 65-85° у синтетики всё ещё ниже реального (часть скользящих лучей отсеивается).
layout: {}
scanner:
  angular_step_deg: 0.0667
  elevation_min_deg: -60.0
  elevation_max_deg: 90.0
  min_range_m: 0.4
  max_range_m: 60.0
  height_m: [1.10, 1.15]
  tilt_sigma_deg: 0.05
effects:
  range_sigma_mm: [0.35, 0.45]
  range_sigma_per_m_mm: [0.0, 0.015]
  incidence_noise_power: 1.0
  beam_divergence_mrad: [0.50, 0.60]
  beam_exit_mm: 1.1
  noise_cap_x_base: 40.0
  grazing_start_deg: 82.0
  echo_separation_m: 1.4
