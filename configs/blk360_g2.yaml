# Leica BLK360 (G2, 2022).
# По спецификации Leica: дальность 0,5-45 м; поле зрения 360 x 270 градусов
# (угол места -45...+90: слепой конус под сканером, на полу круг радиусом ~ высоты станции);
# шаг 6 / 12 / 25 / 50 мм на 10 м (0,034 / 0,069 / 0,143 / 0,286 градуса);
# точность 3D-точки 4 мм на 10 м. Отдельной точности дальности в спецификации нет:
# шум ниже - оценка, НЕ ПРОВЕРЕНО на реальном скане фирмы.
# Шаг 0,143 (режим 25 мм) - 4,7 млн лучей на станцию.
layout: {}
scanner:
  angular_step_deg: 0.143
  elevation_min_deg: -45.0
  elevation_max_deg: 90.0
  min_range_m: 0.5
  max_range_m: 45.0
effects:
  range_sigma_mm: [0.5, 1.5]
  range_sigma_per_m_mm: [0.15, 0.25]
  registration_sigma_mm: [2.0, 6.0]
