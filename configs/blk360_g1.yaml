# Leica BLK360 (G1, 2016).
# По спецификации Leica: дальность 0,6-60 м; поле зрения 360 x 300 градусов
# (угол места -60...+90); шаг 5 / 10 / 20 мм на 10 м (0,029 / 0,057 / 0,115 градуса);
# точность дальности 4 мм на 10 м, 7 мм на 20 м; точность 3D-точки 6 мм на 10 м.
# Модель шума sigma = sigma0 + k * r подобрана под 4 мм на 10 м и 7 мм на 20 м
# (sigma0 ~ 1 мм, k ~ 0,3 мм/м) - НЕ ПРОВЕРЕНО на реальном скане фирмы.
# Шаг 0,115 (режим 20 мм) - самый грубый режим сканера; 8,2 млн лучей на станцию.
layout: {}
scanner:
  angular_step_deg: 0.115
  elevation_min_deg: -60.0
  elevation_max_deg: 90.0
  min_range_m: 0.6
  max_range_m: 60.0
effects:
  range_sigma_mm: [0.7, 1.3]
  range_sigma_per_m_mm: [0.25, 0.35]
  registration_sigma_mm: [2.0, 6.0]
